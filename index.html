<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML File Player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
  .topbar h1 { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
  .topbar h1 span { color: #666; font-weight: 400; font-size: 12px; }

  /* Upload area */
  .upload-area { display: flex; align-items: center; gap: 10px; }
  .upload-btn { background: #fff; color: #000; border: none; padding: 7px 18px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 4px; transition: background 0.15s; }
  .upload-btn:hover { background: #ccc; }
  .file-count { font-size: 12px; color: #666; }

  /* Main layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 280px; flex-shrink: 0; background: #141414; border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 12px 16px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
  .sidebar-header h2 { font-size: 12px; letter-spacing: 2px; color: #666; text-transform: uppercase; }
  .search-box { width: 100%; padding: 8px 12px; background: #1a1a1a; border: 1px solid #2a2a2a; color: #e0e0e0; font-size: 12px; outline: none; border-radius: 3px; margin: 8px 12px; width: calc(100% - 24px); }
  .search-box::placeholder { color: #444; }
  .search-box:focus { border-color: #555; }
  .file-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #1a1a1a; transition: background 0.1s; }
  .file-item:hover { background: #1e1e1e; }
  .file-item.active { background: #252525; border-left: 3px solid #fff; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 10px; color: #555; margin-top: 3px; }
  .file-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  .file-item:hover .file-actions { opacity: 1; }
  .icon-btn { background: transparent; border: 1px solid #333; color: #888; width: 26px; height: 26px; font-size: 12px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
  .icon-btn:hover { background: #fff; color: #000; border-color: #fff; }
  .icon-btn.delete:hover { background: #ff4444; border-color: #ff4444; color: #fff; }

  /* Viewer */
  .viewer { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .viewer-header { padding: 8px 16px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .viewer-title { font-size: 13px; color: #999; }
  .viewer-actions { display: flex; gap: 6px; }
  .viewer-actions button { background: transparent; border: 1px solid #333; color: #888; padding: 4px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; font-family: inherit; }
  .viewer-actions button:hover { background: #fff; color: #000; border-color: #fff; }
  .viewer-actions button.active { background: #333; color: #fff; }

  .iframe-wrap { flex: 1; background: #fff; position: relative; }
  .iframe-wrap iframe { width: 100%; height: 100%; border: none; }

  /* Empty state */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  .empty-state p { font-size: 14px; margin-bottom: 8px; }
  .empty-state small { font-size: 11px; color: #333; }

  /* Drop overlay */
  .drop-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
  .drop-overlay.show { display: flex; }
  .drop-box { border: 2px dashed #555; border-radius: 12px; padding: 60px 80px; text-align: center; }
  .drop-box p { font-size: 18px; color: #888; }
  .drop-box small { font-size: 12px; color: #444; }

  /* Sidebar footer */
  .sidebar-footer { padding: 10px 16px; border-top: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
  .sidebar-footer button { background: transparent; border: 1px solid #333; color: #888; padding: 4px 10px; font-size: 11px; cursor: pointer; border-radius: 3px; font-family: inherit; }
  .sidebar-footer button:hover { background: #fff; color: #000; border-color: #fff; }
  .sidebar-footer button.danger:hover { background: #ff4444; border-color: #ff4444; color: #fff; }
  .sidebar-footer .storage-info { font-size: 10px; color: #444; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }

  /* Toast notification */
  .toast { position: fixed; bottom: 20px; right: 20px; background: #222; color: #fff; padding: 10px 20px; border-radius: 4px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; border: 1px solid #333; }
  .toast.show { opacity: 1; }

  /* Rename modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 150; }
  .modal-overlay.show { display: flex; }
  .modal { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 24px; width: 360px; }
  .modal h3 { font-size: 14px; margin-bottom: 16px; }
  .modal input { width: 100%; padding: 8px 12px; background: #111; border: 1px solid #333; color: #fff; font-size: 13px; outline: none; border-radius: 3px; font-family: inherit; }
  .modal input:focus { border-color: #666; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-actions button { padding: 6px 16px; font-size: 12px; cursor: pointer; border-radius: 3px; font-family: inherit; border: 1px solid #333; }
  .modal-actions .cancel-btn { background: transparent; color: #888; }
  .modal-actions .cancel-btn:hover { background: #333; color: #fff; }
  .modal-actions .save-btn { background: #fff; color: #000; border-color: #fff; }
  .modal-actions .save-btn:hover { background: #ccc; }
</style>
</head>
<body>

<div class="topbar">
  <h1>HTML FILE PLAYER <span>v1.0</span></h1>
  <div class="upload-area">
    <span class="file-count" id="file-count">0 files</span>
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">+ UPLOAD HTML</button>
    <input type="file" id="file-input" accept=".html,.htm" multiple hidden>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Library</h2>
    </div>
    <input type="text" class="search-box" id="search-box" placeholder="Search files...">
    <div class="file-list" id="file-list"></div>
    <div class="sidebar-footer">
      <span class="storage-info" id="storage-info"></span>
      <button class="danger" onclick="clearAll()">Clear All</button>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <div class="viewer-header">
      <span class="viewer-title" id="viewer-title">No file selected</span>
      <div class="viewer-actions">
        <button onclick="openInNewTab()" title="Open in new tab">New Tab</button>
        <button onclick="downloadCurrent()" title="Download file">Download</button>
      </div>
    </div>
    <div class="iframe-wrap" id="iframe-wrap">
      <div class="empty-state" id="empty-state">
        <div class="icon">&#128196;</div>
        <p>No file selected</p>
        <small>Upload HTML files or drag & drop them here</small>
      </div>
    </div>
  </div>
</div>

<div class="drop-overlay" id="drop-overlay">
  <div class="drop-box">
    <p>Drop HTML files here</p>
    <small>Files will be saved to your library</small>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="rename-modal">
  <div class="modal">
    <h3>Rename File</h3>
    <input type="text" id="rename-input" placeholder="Enter new name...">
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeRenameModal()">Cancel</button>
      <button class="save-btn" onclick="saveRename()">Save</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'html_file_player_library';
let files = [];
let activeFileId = null;
let renameTargetId = null;

// Load saved files from localStorage
function loadFiles() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      files = JSON.parse(saved);
    }
  } catch (e) {
    console.error('Failed to load files:', e);
    files = [];
  }
}

// Save files to localStorage
function saveFiles() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
  } catch (e) {
    if (e.name === 'QuotaExceededError') {
      showToast('Storage full! Remove some files to free space.');
    } else {
      console.error('Failed to save files:', e);
    }
  }
}

// Generate unique ID
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Format file size
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

// Format date
function formatDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// Add files from File objects
function addFiles(fileObjs) {
  let added = 0;
  let pending = fileObjs.length;

  Array.from(fileObjs).forEach(file => {
    if (!file.name.match(/\.html?$/i)) {
      pending--;
      if (pending === 0) finishAdd(added);
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const content = e.target.result;
      files.push({
        id: genId(),
        name: file.name,
        content: content,
        size: content.length,
        addedAt: Date.now()
      });
      added++;
      pending--;
      if (pending === 0) finishAdd(added);
    };
    reader.readAsText(file);
  });

  if (fileObjs.length === 0) finishAdd(0);
}

function finishAdd(count) {
  if (count > 0) {
    saveFiles();
    renderFileList();
    updateStorageInfo();
    showToast(count + ' file' + (count > 1 ? 's' : '') + ' added');
    // Auto-select the last added file
    if (!activeFileId && files.length > 0) {
      playFile(files[files.length - 1].id);
    }
  }
}

// Render file list
function renderFileList() {
  const list = document.getElementById('file-list');
  const query = document.getElementById('search-box').value.toLowerCase();

  const filtered = files.filter(f => f.name.toLowerCase().includes(query));

  if (filtered.length === 0) {
    list.innerHTML = '<div style="padding: 20px; text-align: center; color: #333; font-size: 12px;">' +
      (files.length === 0 ? 'No files yet. Upload some HTML files!' : 'No matching files.') + '</div>';
  } else {
    list.innerHTML = filtered.map(f => {
      const isActive = f.id === activeFileId;
      return '<div class="file-item' + (isActive ? ' active' : '') + '" onclick="playFile(\'' + f.id + '\')">' +
        '<div class="file-info">' +
          '<div class="file-name" title="' + escHtml(f.name) + '">' + escHtml(f.name) + '</div>' +
          '<div class="file-meta">' + formatSize(f.size) + ' &middot; ' + formatDate(f.addedAt) + '</div>' +
        '</div>' +
        '<div class="file-actions">' +
          '<button class="icon-btn" onclick="event.stopPropagation(); openRenameModal(\'' + f.id + '\')" title="Rename">&#9998;</button>' +
          '<button class="icon-btn" onclick="event.stopPropagation(); downloadFile(\'' + f.id + '\')" title="Download">&#8615;</button>' +
          '<button class="icon-btn delete" onclick="event.stopPropagation(); deleteFile(\'' + f.id + '\')" title="Delete">&times;</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('file-count').textContent = files.length + ' file' + (files.length !== 1 ? 's' : '');
}

// Play / preview a file
function playFile(id) {
  const file = files.find(f => f.id === id);
  if (!file) return;

  activeFileId = id;
  document.getElementById('viewer-title').textContent = file.name;
  document.getElementById('empty-state').style.display = 'none';

  // Remove existing iframe
  const wrap = document.getElementById('iframe-wrap');
  const oldIframe = wrap.querySelector('iframe');
  if (oldIframe) oldIframe.remove();

  // Create new iframe with the HTML content
  const iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
  wrap.appendChild(iframe);

  // Write content into the iframe
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(file.content);
  doc.close();

  renderFileList();
}

// Delete a file
function deleteFile(id) {
  const file = files.find(f => f.id === id);
  if (!file) return;
  if (!confirm('Delete "' + file.name + '"?')) return;

  files = files.filter(f => f.id !== id);
  saveFiles();

  if (activeFileId === id) {
    activeFileId = null;
    document.getElementById('viewer-title').textContent = 'No file selected';
    const wrap = document.getElementById('iframe-wrap');
    const iframe = wrap.querySelector('iframe');
    if (iframe) iframe.remove();
    document.getElementById('empty-state').style.display = '';
  }

  renderFileList();
  updateStorageInfo();
  showToast('File deleted');
}

// Download a file
function downloadFile(id) {
  const file = files.find(f => f.id === id);
  if (!file) return;

  const blob = new Blob([file.content], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  a.click();
  URL.revokeObjectURL(url);
}

// Download current file
function downloadCurrent() {
  if (activeFileId) downloadFile(activeFileId);
}

// Open current file in new tab
function openInNewTab() {
  const file = files.find(f => f.id === activeFileId);
  if (!file) return;

  const blob = new Blob([file.content], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

// Rename modal
function openRenameModal(id) {
  renameTargetId = id;
  const file = files.find(f => f.id === id);
  if (!file) return;

  document.getElementById('rename-input').value = file.name;
  document.getElementById('rename-modal').classList.add('show');
  setTimeout(() => document.getElementById('rename-input').focus(), 100);
}

function closeRenameModal() {
  document.getElementById('rename-modal').classList.remove('show');
  renameTargetId = null;
}

function saveRename() {
  const file = files.find(f => f.id === renameTargetId);
  if (!file) return;

  const newName = document.getElementById('rename-input').value.trim();
  if (!newName) return;

  file.name = newName;
  saveFiles();
  renderFileList();

  if (activeFileId === renameTargetId) {
    document.getElementById('viewer-title').textContent = newName;
  }

  closeRenameModal();
  showToast('File renamed');
}

// Clear all files
function clearAll() {
  if (files.length === 0) return;
  if (!confirm('Delete all ' + files.length + ' files? This cannot be undone.')) return;

  files = [];
  activeFileId = null;
  saveFiles();
  renderFileList();
  updateStorageInfo();

  document.getElementById('viewer-title').textContent = 'No file selected';
  const wrap = document.getElementById('iframe-wrap');
  const iframe = wrap.querySelector('iframe');
  if (iframe) iframe.remove();
  document.getElementById('empty-state').style.display = '';

  showToast('All files cleared');
}

// Storage info
function updateStorageInfo() {
  const totalBytes = files.reduce((sum, f) => sum + f.size, 0);
  document.getElementById('storage-info').textContent = formatSize(totalBytes) + ' used';
}

// Toast notification
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// Escape HTML
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// File input handler
document.getElementById('file-input').addEventListener('change', function(e) {
  addFiles(e.target.files);
  e.target.value = '';
});

// Search handler
document.getElementById('search-box').addEventListener('input', renderFileList);

// Rename input enter key
document.getElementById('rename-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveRename();
  if (e.key === 'Escape') closeRenameModal();
});

// Drag and drop
let dragCounter = 0;

document.addEventListener('dragenter', function(e) {
  e.preventDefault();
  dragCounter++;
  document.getElementById('drop-overlay').classList.add('show');
});

document.addEventListener('dragleave', function(e) {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    document.getElementById('drop-overlay').classList.remove('show');
  }
});

document.addEventListener('dragover', function(e) {
  e.preventDefault();
});

document.addEventListener('drop', function(e) {
  e.preventDefault();
  dragCounter = 0;
  document.getElementById('drop-overlay').classList.remove('show');
  addFiles(e.dataTransfer.files);
});

// Initialize
loadFiles();
renderFileList();
updateStorageInfo();

// Auto-play last active file if there are files
if (files.length > 0) {
  playFile(files[0].id);
}
</script>

</body>
</html>
